name: astrbot_plugin_trpg_assistant
display_name: 跑团助手
desc: 全能 TRPG 跑团助手：Roll20 规范骰池投掷、技能检定、投掷历史、DnD 先攻追踪、个人/队伍背包管理、会话商店系统（DM 配置商品/价格/库存/回购率，玩家自助买卖，自动折铜扣款找零，初始商店一键生成）、角色卡与 LLM 引导车卡（群级开卡规则：27buy/32buy/dnd5/标准数组，2014/2024 双路径，构筑方案可预填职业/种族/背景直接开卡）、文本角色卡导入（/卡 导入、/车卡 导入，宽松解析 LLM 生成的 txt 卡并自动重算战斗字段）、全自动规则引擎（HP/AC/速度/法术位/攻击加值自动计算，兼职+任意等级+升级重算，种族/背景属性加值自动叠加，武器熟练影响攻击加值，先攻=敏捷修正+房规加值）、角色卡进阶（技能专精双倍熟练、吟游诗人万事通半熟练自动判定、工具/武器/防具熟练项、职业特性/种族特性/专长列表展示、人物基础信息/生命骰/激励/已知法术）、角色卡攻击检定（/r 攻击 直接掷主手武器/指定武器攻击加值）、内置 DND 5e 知识库查询（法术/怪物/物品/专长/背景/职业/状态/种族，同名多版本+按伤害/状态/环境/武器属性/物品类型/稀有度/学派/种族速度/体型/生物类型/抗性/黑暗视觉/天生施法/职业法术表等特性反查+跨库广搜，职业本职/子职特性完整正文可细化：/查职业 战士 特性、/查职业 战士 特性 动作如潮，专长 276 条带 AI 一句话概要并按能力标签反查：/筛专长 远程、近战 伤害、机动，法术 554 条带 AI 一句话概要并按语义标签/职业法术表反查：/筛法术 控场 3环、标签 治疗、召唤、职业 法师，职业 29 条/子职 186 条带 AI 一句话概要+职业定位+能力关键字反查：/筛职业 武者、近战 爆发、/筛子职 治疗 神圣、塑能，种族 160 条/背景 148 条带 AI 一句话概要+能力标签反查：/筛种族 变形、水陆两栖、标签 魅力、/筛背景 隐匿 盗贼工具、贵族、起始专长，物品含库价/重量及魔法变体本体（焰舌/霜铭等 214 条，展开名可作别名检索））及 LLM 函数工具（含按专长/法术/职业/子职/种族/背景标签筛选供 LLM 提供选取建议，以及构筑咨询 advise_build：从零构筑/升级建议，职业法术表+专长前置标注，防幻觉输入侧约束）。支持 DM 运行期添加私设（房规）数据（v0.36.0）：data_dir/trpg_homebrew/*.json 双格式加载（5etools 标准/简化 kind-body），/kb reload 热重载，覆盖官方条目标注 🏠房规，search/detail/filter 与 LLM 工具自动合并私设；私设助手 manage_homebrew（v0.37.0）：纯文本私设转录为合法 JSON（双程校验）、可选直接写入 trpg_homebrew/（配置 homebrew_write_enabled 默认关 + 白名单/管理员，私聊不放行；冲突确认后 overwrite/merge）、对照已有条目点评平衡性（强制先查库）。v0.38.0 新增 /dnd 属性生成指令（4d6kh3×6 一组、最多 20 组、写投掷历史）与中文优势/劣势紧贴后缀语法（/r d20优势、/r d20劣势+2、/r d20优势+1d4，等价 adv/dis，/r、自定义前缀、LLM 工具三入口生效，带空格/前置写法报错）。v0.39.0 新增商店批量操作与整店清空（/商店 清空 管理员一键清空、保留回购系数；/商店 买 长剑 匕首 2 批量买/卖（数量可省略）、上架/下架批量（逐项属性归属），批量逐件原子失败不阻断；LLM 工具 manage_shop 新增 items 批量参数并开放 add/remove/clear 管理动作（工具内鉴权））。知识库数据源自 5etools 中文站（CC BY-NC-SA 4.0，仅限非商业使用，详见 NOTICE）。基于 Dracowyn/astrbot_plugin_dnd_dice 的 MIT fork。
